[project]
name = "edu-track-analytics"
version = "0.1.0"
description = "Serviço analítico interno do EduTrack AI"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115.6",
  "pandas>=2.2.3",
  "pydantic>=2.10.4",
  "uvicorn[standard]>=0.34.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.4",
  "ruff>=0.8.4"
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
